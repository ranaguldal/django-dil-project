<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Çeviri Aracı - Lingua</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            🌍 Lingua
        </a>

        <div class="d-flex align-items-center gap-2">

            <form action="{% url 'search' %}" method="get" class="d-flex" role="search">
                <input type="search" name="q" class="form-control form-control-sm" placeholder="Ders veya kurs ara..." style="width: 180px;">
                <button class="btn btn-sm btn-outline-light ms-1" type="submit">🔍</button>
            </form>

            <button
                id="themeToggle"
                type="button"
                class="btn btn-outline-light"
                data-bs-toggle="tooltip"
                data-bs-placement="bottom"
                title="Karanlık Mod / Aydınlık Mod">
                🌓
            </button>

            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="btn btn-outline-light">
                📊 Panelim
            </a>
            {% endif %}

            <a
                href="{% url 'home' %}"
                class="btn btn-outline-light">

                Ana Sayfa

            </a>

        </div>

    </div>

</nav>


<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto" style="max-width: 700px;">

        <div class="card-body p-4 p-md-5">

            <h1 class="fw-bold mb-4">🌐 Çeviri Aracı</h1>

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Metin</label>
                <textarea
                    id="sourceText"
                    class="form-control"
                    rows="4"
                    placeholder="Çevrilecek metni yaz..."></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Hedef Dil</label>
                <select id="targetLang" class="form-select">
                    <option value="EN-US">İngilizce</option>
                    <option value="TR">Türkçe</option>
                    <option value="DE">Almanca</option>
                    <option value="FR">Fransızca</option>
                    <option value="ES">İspanyolca</option>
                </select>
            </div>

            <button id="translateBtn" class="btn btn-primary">
                Çevir
            </button>

            <div id="resultBox" class="alert alert-secondary mt-4 d-none">
            </div>

        </div>

    </div>

</div>


<script>
function getCsrfToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
}

document.getElementById('translateBtn').addEventListener('click', function () {

    const text = document.getElementById('sourceText').value.trim();
    const targetLang = document.getElementById('targetLang').value;
    const resultBox = document.getElementById('resultBox');

    if (!text) {
        return;
    }

    resultBox.classList.remove('d-none', 'alert-danger');
    resultBox.classList.add('alert-secondary');
    resultBox.innerText = 'Çevriliyor...';

    fetch('{% url "translate_api" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken(),
        },
        body: JSON.stringify({ text: text, target_lang: targetLang }),
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            resultBox.classList.remove('alert-secondary');
            resultBox.classList.add('alert-danger');
            resultBox.innerText = data.error;
        } else {
            resultBox.classList.remove('alert-danger');
            resultBox.classList.add('alert-secondary');
            resultBox.innerText = data.translated_text;
        }
    })
    .catch(() => {
        resultBox.classList.remove('alert-secondary');
        resultBox.classList.add('alert-danger');
        resultBox.innerText = 'Bir hata oluştu.';
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function () {
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-bs-theme', savedTheme);

    const toggleBtn = document.getElementById('themeToggle');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
            const current = html.getAttribute('data-bs-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            localStorage.setItem('theme', next);
        });
    }

    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
        new bootstrap.Tooltip(el);
    });
})();
</script>

</body>

</html>
