<!DOCTYPE html>

<html lang="tr"  data-bs-theme="light">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kayıt Ol - Lingooma</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🌍 Lingooma
        </a>

        <div class="d-flex align-items-center gap-2">

            <form action="{% url 'search' %}" method="get" class="d-flex" role="search">
                <input type="search" name="q" class="form-control form-control-sm" placeholder="Ders veya kurs ara..." style="width: 180px;">
                <button class="btn btn-sm btn-outline-light ms-1" type="submit">🔍</button>
            </form>

            <button
                id="themeToggle"
                type="button"
                class="btn btn-outline-light"
                data-bs-toggle="tooltip"
                data-bs-placement="bottom"
                title="Karanlık Mod / Aydınlık Mod">
                🌓
            </button>

            <a href="/" class="btn btn-outline-light">
                Ana Sayfa
            </a>

        </div>

    </div>

</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="fw-bold text-center mb-4">
                        Kayıt Ol
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Kayıt Ol

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <a href="/">
                            Ana Sayfaya Dön
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function () {
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-bs-theme', savedTheme);

    const toggleBtn = document.getElementById('themeToggle');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
            const current = html.getAttribute('data-bs-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            localStorage.setItem('theme', next);
        });
    }

    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
        new bootstrap.Tooltip(el);
    });
})();
</script>

</body>

</html>
