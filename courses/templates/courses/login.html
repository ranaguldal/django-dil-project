<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap - Lingooma</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🌍 Lingooma
        </a>

        <a href="/" class="btn btn-outline-light">
            Ana Sayfa
        </a>

    </div>

</nav>


<div class="container py-5">

    <div
        class="card shadow-sm border-0 mx-auto"
        style="max-width: 500px;">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h1 class="fw-bold">
                    Giriş Yap
                </h1>

                <p class="text-secondary">
                    Lingooma hesabına giriş yap.
                </p>

            </div>


            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label">

                        Kullanıcı Adı

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        required>

                </div>


                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label">

                        Şifre

                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Giriş Yap

                </button>

            </form>


            <div class="text-center mt-4">

                <span class="text-secondary">
                    Hesabın yok mu?
                </span>

                <a href="{% url 'register' %}">
                    Kayıt Ol
                </a>

            </div>

        </div>

    </div>

</div>


</body>

</html>
